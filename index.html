<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team White and Black</title>
<meta name="description" content="Catálogo de playeras y polos. Pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#fafafa;--grey:#8a8a8a;--line:#d9d9d9;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Archivo',Arial,sans-serif;background:var(--white);color:var(--black);line-height:1.5}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--black);outline-offset:3px}

/* Barra superior */
header.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);mix-blend-mode:difference;color:#fff}
.logo{font-family:'Archivo Black',Impact,sans-serif;font-size:1.05rem;letter-spacing:.02em;text-decoration:none;color:inherit}
.bar a.pedir{color:inherit;text-decoration:none;font-weight:700;border-bottom:2px solid currentColor}

/* Portada: mitad blanca / mitad negra */
.hero{min-height:100svh;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden}
.hero .w{background:var(--white)}
.hero .b{background:var(--black);transform-origin:right;animation:wipe 1.1s var(--ease) both}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero h1{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(16px,4vw,48px);font-family:'Archivo Black',Impact,sans-serif;font-size:clamp(3.2rem,13vw,12rem);line-height:.88;letter-spacing:-.03em;text-transform:uppercase;pointer-events:none}
.hero h1 span{display:block;white-space:nowrap}
.hero h1{color:#fff;mix-blend-mode:difference;z-index:2}
.hero h1 .l1,.hero h1 .l2,.hero h1 .l3{opacity:0;animation:rise .9s var(--ease) forwards}
.hero h1 .l2{animation-delay:.25s}.hero h1 .l3{animation-delay:.5s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.hero p.sub{position:absolute;left:clamp(16px,4vw,48px);bottom:clamp(20px,5vh,48px);max-width:320px;font-size:.95rem;opacity:0;animation:rise .9s .9s var(--ease) forwards;color:var(--black)}
.hero a.cta{position:absolute;right:clamp(16px,4vw,48px);bottom:clamp(20px,5vh,48px);background:var(--white);color:var(--black);padding:14px 26px;font-weight:700;text-decoration:none;opacity:0;animation:rise .9s 1s var(--ease) forwards;transition:transform .25s var(--ease),background .25s}
.hero a.cta:hover{transform:translateY(-3px);background:#fff}

/* Cinta */
.strip{background:var(--black);color:var(--white);overflow:hidden;white-space:nowrap;padding:14px 0;font-family:'Archivo Black',Impact,sans-serif;letter-spacing:.04em}
.strip div{display:inline-block;animation:slide 28s linear infinite}
.strip span{margin:0 28px}
@keyframes slide{to{transform:translateX(-50%)}}

/* Catálogo */
main{padding:clamp(48px,9vw,110px) clamp(16px,4vw,48px)}
.head{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:end;margin-bottom:36px}
.head h2{font-family:'Archivo Black',Impact,sans-serif;font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.02em;line-height:1}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--black);background:transparent;padding:9px 20px;font-weight:700;transition:background .2s,color .2s}
.filters button:hover,.filters button.on{background:var(--black);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:clamp(16px,2.5vw,32px)}
.card{display:flex;flex-direction:column;opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.card.show{opacity:1;transform:none}
.card.hide{display:none}
.card .ph{position:relative;aspect-ratio:1/1;overflow:hidden;background:#ececec;border:0;padding:0;display:block;width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.card .ph:hover img{transform:scale(1.06)}
.card .ph .tag{position:absolute;left:12px;top:12px;background:var(--black);color:var(--white);font-size:.75rem;font-weight:700;padding:4px 10px}
.card h3{font-family:'Archivo Black',Impact,sans-serif;font-size:1.15rem;margin-top:14px;font-weight:400}
.card .meta{color:var(--grey);font-size:.9rem}
.card .price{font-weight:700;margin:6px 0 14px}
.sizes{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.size{min-width:44px;padding:7px 10px;border:2px solid var(--black);background:transparent;font-weight:700;font-size:.85rem;transition:background .2s,color .2s,transform .2s var(--ease)}
.size:hover{background:#e8e8e8;transform:translateY(-2px)}
.size.on{background:var(--black);color:var(--white)}
.sizes.need{animation:shake .45s}
.sizes.need::after{content:"Elige tu talla primero";flex-basis:100%;font-size:.8rem;font-weight:700}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--black);color:var(--white);border:2px solid var(--black);padding:12px 18px;font-weight:700;text-decoration:none;margin-top:auto;transition:background .25s,color .25s}
.btn:hover{background:var(--white);color:var(--black)}

/* Ventana de detalle */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.82);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.open{opacity:1;visibility:visible}
.modal .box{background:var(--white);width:min(920px,100%);max-height:94vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;transform:translateY(24px) scale(.97);transition:transform .4s var(--ease)}
.modal.open .box{transform:none}
.modal .imgs{background:#ececec}
.modal .imgs img{width:100%}
.modal .info{padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:12px}
.modal .info h3{font-family:'Archivo Black',Impact,sans-serif;font-size:1.7rem;font-weight:400;line-height:1.1}
.modal .close{align-self:flex-end;background:none;border:2px solid var(--black);width:40px;height:40px;font-size:1.2rem}
.modal .close:hover{background:var(--black);color:var(--white)}

/* Pie */
footer{background:var(--black);color:var(--white);padding:clamp(40px,7vw,80px) clamp(16px,4vw,48px);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
footer h2{font-family:'Archivo Black',Impact,sans-serif;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1}
footer .btn{background:var(--white);color:var(--black);border-color:var(--white);margin:0}
footer .btn:hover{background:transparent;color:var(--white)}
.wa{position:fixed;right:18px;bottom:18px;z-index:30;background:var(--black);color:var(--white);border:2px solid var(--white);padding:13px 20px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.wa:hover{transform:translateY(-4px)}

@media(max-width:720px){
 .modal .box{grid-template-columns:1fr}
 .hero p.sub{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .card{opacity:1;transform:none}.strip div{animation:none}
}
</style>
</head>
<body>

<header class="bar">
  <a class="logo" href="#top">TEAM WHITE AND BLACK</a>
  <a class="pedir" id="topWa" href="#" target="_blank" rel="noopener">Pedir</a>
</header>

<section class="hero" id="top">
  <div class="w"></div><div class="b"></div>
  <h1 aria-label="Team White and Black">
    <span class="l1">Team</span><span class="l2">White and</span><span class="l3">Black</span>
  </h1>
  <p class="sub">Playeras y polos de marca. Elige tu prenda y pídela directo por WhatsApp.</p>
  <a class="cta" href="#catalogo">Ver catálogo</a>
</section>

<div class="strip" aria-hidden="true"><div id="strip"></div></div>

<main id="catalogo">
  <div class="head">
    <h2>Catálogo</h2>
    <div class="filters" id="filters">
      <button class="on" data-f="todos">Todos</button>
      <button data-f="Playera">Playeras</button>
      <button data-f="Polo">Polos</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <h2>¿Listo para pedir?<br>Escríbenos por WhatsApp.</h2>
  <a class="btn" id="footWa" href="#" target="_blank" rel="noopener">Escribir por WhatsApp</a>
</footer>

<a class="wa" id="floatWa" href="#" target="_blank" rel="noopener">WhatsApp</a>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="box">
    <div class="imgs" id="mImgs"></div>
    <div class="info">
      <button class="close" id="mClose" aria-label="Cerrar">✕</button>
      <h3 id="mTitle"></h3>
      <p class="meta" id="mMeta"></p>
      <p id="mDesc"></p>
      <p class="price" id="mPrice"></p>
      <div id="mSlot"></div>
      <a class="btn" id="mWa" href="#" target="_blank" rel="noopener">Pedir por WhatsApp</a>
    </div>
  </div>
</div>

<script>
/* ============ EDITA AQUÍ ============ */
const WHATSAPP = "524775814003";   // 52 (México) + tu número
const MONEDA = "$";

/* Cada producto: agrega, borra o cambia lo que quieras.
   - tipo: "Playera" o "Polo"
   - precio: número (ej. 350). Déjalo en 0 para mostrar "Consultar precio"
   - tallas: ejemplo "S, M, L, XL" para mostrar solo esas. Vacío "" = XS, S, M, L, XL, XXL (lista TALLAS_DEFAULT más abajo)
   - fotos: lista de imágenes (la primera es la portada) */
const PRODUCTOS = [
  {nombre:"Hugo Logo", tipo:"Playera", color:"Crema", precio:0, tallas:"", desc:"Playera color crema con logo HUGO bordado al centro.", fotos:["images/n-hugo-logo-crema.jpg"]},
  {nombre:"Hugo Logo", tipo:"Playera", color:"Blanca", precio:0, tallas:"", desc:"Playera blanca con logo HUGO al centro.", fotos:["images/n-hugo-logo-blanca.jpg"]},
  {nombre:"Hugo Firma", tipo:"Playera", color:"Blanca", precio:0, tallas:"", desc:"Playera blanca con firma Hugo bordada.", fotos:["images/n-hugo-firma-blanca.jpg"]},
  {nombre:"Boss", tipo:"Playera", color:"Blanca", precio:0, tallas:"", desc:"Playera blanca con logo Boss al pecho.", fotos:["images/n-boss-blanca.jpg"]},
  {nombre:"Balenciaga", tipo:"Playera", color:"Beige", precio:0, tallas:"", desc:"Playera con logo BB al centro.", fotos:["images/n-balenciaga.jpg"]},
  {nombre:"Burberry", tipo:"Playera", color:"Negra", precio:0, tallas:"", desc:"Playera con monograma TB al pecho.", fotos:["images/n-burberry-negra.jpg","images/n-burberry-negra-2.jpg"]},
  {nombre:"Amiri", tipo:"Playera", color:"Roja", precio:0, tallas:"", desc:"Playera con logo MA bordado.", fotos:["images/n-amiri-roja.jpg"]},
  {nombre:"Calvin Klein cK", tipo:"Playera", color:"Blanca", precio:0, tallas:"", desc:"Playera blanca con logo cK al pecho.", fotos:["images/n-ck-cK-blanca.jpg"]},
  {nombre:"Calvin Klein CK", tipo:"Playera", color:"Beige", precio:0, tallas:"", desc:"Playera de cuello redondo con logo cK al centro.", fotos:["images/n-ck-beige.jpg"]},
  {nombre:"Hugo", tipo:"Polo", color:"Morado", precio:0, tallas:"", desc:"Polo morado con cuello de línea, botones y logo Hugo.", fotos:["images/n-hugo-polo-morado.jpg"]},
  {nombre:"Hugo", tipo:"Polo", color:"Azul marino", precio:0, tallas:"", desc:"Polo azul marino con botones metálicos y logo Hugo.", fotos:["images/n-hugo-polo-azul-marino.jpg"]},
  {nombre:"Maja", tipo:"Polo", color:"Azul marino", precio:0, tallas:"", desc:"Polo ligero con logo Maja al pecho.", fotos:["images/n-maja-polo-azul.jpg"]},
  {nombre:"Boss Oliva", tipo:"Polo", color:"Oliva", precio:0, tallas:"", desc:"Polo ligero oliva con botones negros y logo Boss blanco.", fotos:["images/n-boss-polo-oliva-botones.jpg"]},
  {nombre:"Boss Línea", tipo:"Polo", color:"Oliva", precio:0, tallas:"", desc:"Polo oliva con cuello de línea, detalle en la tapa de botones y logo Boss negro.", fotos:["images/n-boss-polo-oliva-linea.jpg"]},
  {nombre:"Burberry", tipo:"Polo", color:"Blanco", precio:0, tallas:"", desc:"Polo blanco con logo Burberry al pecho.", fotos:["images/n-burberry-polo-blanco.jpg"]}
];
/* ============ FIN DE LO EDITABLE ============ */

const $ = s => document.querySelector(s);
const precioTxt = p => p > 0 ? MONEDA + p.toLocaleString("es-MX") : "Consultar precio";
const wa = msg => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
const pedido = (p, talla) => `Hola, me interesa: ${p.nombre} (${p.tipo}, ${p.color}), talla ${talla}. ¿Está disponible?`;

["#topWa","#footWa","#floatWa"].forEach(id => $(id).href = wa("Hola, quiero información del catálogo de Team White and Black."));

$("#strip").innerHTML = Array(12).fill('<span>TEAM WHITE AND BLACK</span><span>●</span>').join("");

const grid = $("#grid");
const TALLAS_DEFAULT = ["XS","S","M","L","XL","XXL"];
const listaTallas = p => p.tallas ? p.tallas.split(",").map(t => t.trim()).filter(Boolean) : TALLAS_DEFAULT;

function crearTallas(p){
  const box = document.createElement("div");
  box.className = "sizes"; box.setAttribute("role","group"); box.setAttribute("aria-label","Elige tu talla");
  box.dataset.talla = "";
  listaTallas(p).forEach(t => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "size"; b.textContent = t;
    b.onclick = () => {
      box.querySelectorAll(".size").forEach(x => x.classList.toggle("on", x === b));
      box.dataset.talla = t; box.classList.remove("need");
    };
    box.appendChild(b);
  });
  return box;
}
function enlazarPedido(btn, box, p){
  btn.href = "#";
  btn.onclick = e => {
    if (!box.dataset.talla){
      e.preventDefault();
      box.classList.remove("need"); void box.offsetWidth; box.classList.add("need");
      return;
    }
    btn.href = wa(pedido(p, box.dataset.talla));
  };
}

PRODUCTOS.forEach(p => {
  const c = document.createElement("article");
  c.className = "card"; c.dataset.tipo = p.tipo;
  c.innerHTML = `
    <button class="ph" aria-label="Ver ${p.nombre}"><img src="${p.fotos[0]}" alt="${p.nombre} ${p.tipo.toLowerCase()} ${p.color.toLowerCase()}" loading="lazy"><span class="tag">${p.tipo}</span></button>
    <h3>${p.nombre}</h3>
    <p class="meta">${p.color}</p>
    <p class="price">${precioTxt(p.precio)}</p>
    <div class="slot"></div>
    <a class="btn" target="_blank" rel="noopener">Pedir por WhatsApp</a>`;
  const box = crearTallas(p);
  c.querySelector(".slot").replaceWith(box);
  enlazarPedido(c.querySelector(".btn"), box, p);
  c.querySelector(".ph").onclick = () => openModal(p);
  grid.appendChild(c);
});

/* Aparición al hacer scroll */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add("show"); io.unobserve(e.target); }
}), {threshold:.12});
const observar = () => document.querySelectorAll(".card:not(.hide):not(.show)").forEach(c => io.observe(c));
observar();

/* Filtros */
$("#filters").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("hide", b.dataset.f !== "todos" && c.dataset.tipo !== b.dataset.f);
  });
  observar();
};

/* Detalle */
const modal = $("#modal");
function openModal(p){
  $("#mTitle").textContent = p.nombre;
  $("#mMeta").textContent = `${p.tipo} · ${p.color}`;
  $("#mDesc").textContent = p.desc;
  $("#mPrice").textContent = precioTxt(p.precio);
  const box = crearTallas(p); box.id = "mSlot"; $("#mSlot").replaceWith(box); enlazarPedido($("#mWa"), box, p);
  $("#mImgs").innerHTML = p.fotos.map(f => `<img src="${f}" alt="${p.nombre}">`).join("");
  modal.classList.add("open"); document.body.style.overflow = "hidden";
  $("#mClose").focus();
}
function closeModal(){ modal.classList.remove("open"); document.body.style.overflow = ""; }
$("#mClose").onclick = closeModal;
modal.onclick = e => { if(e.target === modal) closeModal(); };
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });
</script>
</body>
</html>
